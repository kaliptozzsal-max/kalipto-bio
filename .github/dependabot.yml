version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm dependencies
  # ---------------------------------------------------------------------------
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    versioning-strategy: increase
    commit-message:
      # No `include: scope` here — Dependabot appends the scope itself, which
      # combined with a prefix that already names it produced titles like
      # "chore(deps-dev)(deps-dev): bump ...".
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    labels:
      - dependencies

    # Minor and patch bumps are grouped into a single pull request so routine
    # upkeep is one review rather than a dozen. Majors stay separate, because
    # they carry breaking changes that deserve individual attention.
    groups:
      production-minor-patch:
        dependency-type: production
        update-types:
          - minor
          - patch
        exclude-patterns:
          # react-icons ships icon removals in MINOR releases, because it
          # tracks Simple Icons and brands come and go. 5.7.0 dropped both
          # SiOpenai and SiLinkedin, which this project imports, and CI caught
          # it as a type error. Excluding it from the group means its updates
          # arrive as a standalone PR that gets read rather than rubber-stamped.
          - react-icons
      development-minor-patch:
        dependency-type: development
        update-types:
          - minor
          - patch

    ignore:
      # Framework majors are deliberately manual: they require reading an
      # upgrade guide, not merging a green PR.
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      # Toolchain majors have to move together with eslint-config-next, which
      # constrains which versions actually work. Individually they only ever
      # produce PRs that cannot pass CI.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions used by the workflows above
  # ---------------------------------------------------------------------------
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "05:00"
      timezone: Asia/Phnom_Penh
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
    labels:
      - dependencies
      - github-actions
    groups:
      actions:
        patterns:
          - "*"
